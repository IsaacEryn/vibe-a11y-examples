<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그림 8-1 데모 — 진짜 버튼 vs 가짜 버튼</title>
<style>
  body { font-family: 'Apple SD Gothic Neo','Noto Sans KR',sans-serif; background:#fff; color:#111;
         display:flex; gap:64px; justify-content:center; align-items:flex-start; padding:56px 24px; }
  .col { text-align:center; width: 260px; }
  .col h2 { font-size:17px; margin:0 0 6px; }
  .col p  { font-size:13px; color:#555; margin:0 0 20px; font-family: ui-monospace, monospace; }
  /* 두 버튼에 완전히 동일한 스타일 */
  .submit-btn {
    display:inline-block; border:0; cursor:pointer;
    padding:14px 44px; border-radius:12px;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    color:#fff; font-size:17px; font-weight:700; font-family:inherit;
  }
  :focus-visible { outline:3px solid #1a56db; outline-offset:3px; }
</style>
</head>
<body>
  <div class="col">
    <h2>진짜 버튼</h2>
    <p>&lt;button&gt;</p>
    <button type="button" class="submit-btn" onclick="alert('제출되었습니다')">제출하기</button>
  </div>
  <div class="col">
    <h2>가짜 버튼</h2>
    <p>&lt;div onclick&gt;</p>
    <div class="submit-btn" onclick="alert('제출되었습니다')">제출하기</div>
  </div>
</body>
</html>

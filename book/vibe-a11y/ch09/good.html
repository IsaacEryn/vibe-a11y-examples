<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9장 — 진짜 버튼 체험 (좋은 예)</title>
<style>
  body { font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif; color:#1a1a1a; background:#fff;
         max-width:720px; margin:0 auto; padding:40px 24px; line-height:1.7; }
  h1 { font-size:1.3rem; }
  a { color:#1d4ed8; }
  :focus-visible { outline:3px solid #1d4ed8; outline-offset:3px; }
  .try { border:2px solid #1d4ed8; background:#eff6ff; border-radius:10px; padding:14px 18px; margin:24px 0; }
  .try h2 { font-size:1rem; margin:0 0 8px; }
  .stage { border:1px dashed #999; border-radius:12px; padding:40px 20px; text-align:center; margin:28px 0; }
  .submit-btn { display:inline-block; border:0; cursor:pointer; padding:14px 44px; border-radius:12px;
                background:linear-gradient(135deg,#4f46e5,#7c3aed); color:#fff; font-size:17px; font-weight:700;
                font-family:inherit; }
  footer { margin-top:48px; font-size:.85rem; color:#555; }
</style>
</head>
<body>
<header>
  <nav aria-label="상위 이동"><a href="../">데모 목록으로</a></nav>
  <h1>9장 — 진짜 버튼 체험</h1>
  <p>겉모습은 <a href="bad.html">가짜 버튼</a>과 완전히 같습니다. 코드만 <code>&lt;button&gt;</code>입니다.</p>
</header>
<main>
  <div class="try">
    <h2>이렇게 해보세요</h2>
    <ol style="margin:0 0 0 1.1rem; padding:0;">
      <li><kbd>Tab</kbd> 키를 눌러보세요 — 버튼에 도착하고, 포커스 링이 보입니다.</li>
      <li>그 상태에서 <kbd>Enter</kbd>나 <kbd>Space</kbd>를 눌러보세요 — 눌립니다.</li>
      <li>스크린리더로 들으면 "제출하기, 버튼"이라고 안내됩니다.</li>
    </ol>
  </div>

  <div class="stage">
    <button type="button" class="submit-btn" onclick="alert('제출되었습니다 — 어떤 방식으로든.')">제출하기</button>
  </div>

  <p>바꾼 것은 태그 하나입니다. 키보드 도달, 역할 안내, Enter/Space 동작이 전부 공짜로 따라왔습니다.</p>
</main>
<footer><p><a href="https://github.com/IsaacEryn/vibe-a11y-examples">소스 보기</a></p></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12장 포커스 표시를 지운 화면 (도판용) — 바이브 코딩, 접근성까지 부탁해</title>
<meta name="description" content="Tab으로 이동했는데 아무 표시도 남지 않는 화면입니다. 책 그림에서 포커스 표시가 없는 쪽입니다.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  /* 이 페이지는 책의 그림(포커스 링 비교) 중 포커스 표시가 없는 쪽입니다.
     포커스는 문서마다 하나뿐이라 두 상태를 한 화면에 담을 수 없어,
     같은 폼을 두 페이지로 나누고 지면에서 나란히 붙입니다.
     포커스 표시가 있는 쪽은 focus-on.html입니다. */
  body { font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif; background:#fff; color:#111; margin:0; }
  .shot { padding:44px 24px; min-height:430px; box-sizing:border-box; }
  .col { width:100%; max-width:330px; margin:0 auto; }
  .col > h2 { font-size:16px; text-align:center; margin:0 0 18px; }
  .form { border:1px solid #d5d5d5; border-radius:12px; padding:20px 18px 22px; }
  .field { margin:0 0 14px; }
  label { display:block; font-size:13.5px; font-weight:600; margin:0 0 6px; }
  input { width:100%; box-sizing:border-box; padding:9px 11px; font-size:14px;
          font-family:inherit; border:1px solid #9ca3af; border-radius:7px; background:#fff; }
  .send { width:100%; padding:11px; border-radius:8px; border:0; cursor:pointer;
          background:#1d4ed8; color:#fff; font-size:15px; font-weight:700; font-family:inherit; }
  .caption { font-size:12.5px; color:#666; margin-top:12px; text-align:center;
             font-family:inherit; line-height:1.6; }

  /* 이 페이지의 '의도된 문제'입니다. 흔한 CSS 리셋 관습이 그대로 들어간 모습입니다. */
  .form :focus { outline:none; }
  .form :focus-visible { outline:none; }

  /* 아래는 캡처 영역 밖의 안내입니다. */
  .below { max-width:620px; margin:0 auto; padding:0 24px 56px; line-height:1.7; }
  .below .notice { border:1px solid #92400e; border-left-width:5px; background:#fffbeb; color:#78350f;
                   border-radius:10px; padding:14px 18px; margin:0 0 20px; }
  .below p { margin:0 0 14px; }
  .below a { color:#1d4ed8; }

  /* 화면에는 보이지 않지만 스크린리더는 읽는 제목입니다. 지면 캡처 영역을 바꾸지 않으려고
     시각적으로만 감춥니다(display:none으로 감추면 보조기기에서도 사라집니다). */
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px;
             overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  .caption code { font-family:ui-monospace,monospace; font-size:.95em; }
</style>
</head>
<body>
<main>
  <h1 class="sr-only">12장 포커스 표시를 지운 화면 (도판용)</h1>
  <div class="shot">
    <div class="col">
      <h2>포커스 표시를 지운 화면</h2>
      <div class="form">
        <div class="field">
          <label for="a-name">이름</label>
          <input id="a-name" type="text" value="홍길동">
        </div>
        <div class="field">
          <label for="a-mail">이메일</label>
          <!-- Tab을 두 번 누른 상태를 그대로 재현하려고 포커스를 여기에 둡니다. -->
          <input id="a-mail" type="email" value="hong@example.com" autofocus>
        </div>
        <button type="button" class="send">신청하기</button>
      </div>
      <p class="caption"><code>outline: none</code><br>포커스는 이메일 칸에 있는데 화면에 표시가 없다</p>
    </div>
  </div>

  <div class="below">
    <div class="notice">
      <p><strong>의도적으로 잘못 만든 교보재입니다.</strong>
         지금 포커스는 이메일 칸에 들어와 있습니다. 화면에는 아무 표시도 없습니다.</p>
    </div>
    <p>이 페이지는 책 그림에서 포커스 표시가 없는 쪽입니다. 포커스는 문서마다 하나뿐이라
       '보이는 화면'과 '보이지 않는 화면'을 한 페이지에 함께 둘 수 없어서,
       같은 폼을 두 페이지로 나눠두었습니다.</p>
    <p><a href="focus-on.html">포커스가 보이는 화면 보기</a> ·
       <a href="../">실습 데모 목록으로</a></p>
  </div>
</main>
</body>
</html>

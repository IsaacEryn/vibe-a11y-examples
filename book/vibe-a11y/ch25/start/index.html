<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>초록상점 카페</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="logo">초록상점 카페</div>
    <div class="nav">
      <a class="n-loca" href="location.html">오시는 길</a>
      <a class="n-menu" href="menu.html">메뉴</a>
      <a class="n-home" href="index.html">홈</a>
    </div>
  </div>
</div>

<div class="wrap">

  <div class="hero">
    <div class="big">동네에서 제일 조용한 카페</div>
    <p class="sub">원두는 매주 목요일에 볶습니다. 오후 2시 이후에는 자리가 넉넉합니다.</p>
    <div class="cta" onclick="location.href='location.html'">찾아오는 길 보기</div>
  </div>

  <div class="section">
    <div class="title">오늘의 메뉴</div>
    <div class="cards">
      <div class="card" onclick="location.href='menu.html'">
        <img class="thumb" src="images/menu1.jpg" alt="menu1.jpg">
        <div class="body">
          <div class="name">핸드드립 커피</div>
          <p class="price">5,000원</p>
        </div>
      </div>
      <div class="card" onclick="location.href='menu.html'">
        <img class="thumb" src="images/menu2.jpg" alt="menu2.jpg">
        <div class="body">
          <div class="name">계절 과일 에이드</div>
          <p class="price">6,500원</p>
        </div>
      </div>
      <div class="card" onclick="location.href='menu.html'">
        <img class="thumb" src="images/menu3.jpg" alt="menu3.jpg">
        <div class="body">
          <div class="name">치즈 케이크</div>
          <p class="price">6,000원</p>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="title">공지</div>
    <p class="sub">8월 15일은 정기 휴무입니다. 자세한 내용은 아래에서 확인하세요.</p>
    <div class="cta" onclick="openNotice()">공지 열기</div>
  </div>

  <div class="foot">초록상점 카페 · 서울 어딘가 · 070-0000-0000</div>
</div>

<div class="notice-dim" id="dim">
  <div class="notice-box">
    <h3>8월 정기 휴무 안내</h3>
    <p>8월 15일(금)은 쉽니다. 8월 16일부터 평소대로 문을 엽니다.</p>
    <div class="notice-close" onclick="closeNotice()">닫기</div>
  </div>
</div>

<script>
  function openNotice() { document.getElementById('dim').style.display = 'flex'; }
  function closeNotice() { document.getElementById('dim').style.display = 'none'; }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>초록상점 카페</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <div class="wrap">
    <div class="logo">초록상점 카페</div>
    <div class="nav">
      <a class="n-loca" href="location.html">오시는 길</a>
      <a class="n-menu" href="menu.html">메뉴</a>
      <a class="n-home" href="index.html">홈</a>
      <a href="notice/list.html">공지</a>
    </div>
  </div>
</div>
<div class="wrap">
  <div class="hero">
    <div class="big">원데이 클래스</div>
    <p class="sub">한 달에 두 번, 토요일 오전에 엽니다.</p>
  </div>

  <div class="section">
    <div class="title">이번 달 일정</div>
    <div class="cards">
      <div class="card" onclick="location.href='class-apply.html'">
        <img class="thumb" src="images/class1.jpg" alt="class1.jpg">
        <div class="body">
          <div class="name">핸드드립 입문</div>
          <p class="price">3월 15일 · 35,000원</p>
        </div>
      </div>
      <div class="card" onclick="location.href='class-apply.html'">
        <img class="thumb" src="images/class2.jpg" alt="class2.jpg">
        <div class="body">
          <div class="name">라테아트 기초</div>
          <p class="price">3월 29일 · 40,000원</p>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="title">신청 현황</div>
    <p class="sub">
      <span style="color:#7cb342">●</span> 자리 있음 &nbsp;
      <span style="color:#e53935">●</span> 마감
    </p>
    <div style="display:flex;gap:10px;padding:6px 0">
      <div style="width:140px">3월 15일 10:00</div><div><span style="color:#7cb342">●</span></div>
    </div>
    <div style="display:flex;gap:10px;padding:6px 0">
      <div style="width:140px">3월 29일 10:00</div><div><span style="color:#e53935">●</span></div>
    </div>
  </div>
  <div class="foot">초록상점 카페 · 서울 어딘가 · 070-0000-0000</div>
</div>

</html>

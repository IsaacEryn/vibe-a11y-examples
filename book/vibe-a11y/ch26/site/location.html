<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>초록상점 카페</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="logo">초록상점 카페</div>
    <div class="nav">
      <a class="n-loca" href="location.html">오시는 길</a>
      <a class="n-menu" href="menu.html">메뉴</a>
      <a class="n-home" href="index.html">홈</a>
      <a href="notice/list.html">공지</a>
    </div>
  </div>
</div>

<div class="wrap">

  <div class="hero">
    <div class="big">오시는 길</div>
    <p class="sub">지하철 3번 출구에서 걸어서 5분입니다.</p>
  </div>

  <div class="section">
    <div class="title">약도</div>
    <img class="thumb" style="width:100%;max-width:560px;height:220px" src="images/map.png" alt="map.png">
    <p class="sub">주차는 건물 뒤편에 두 자리 있습니다.</p>
  </div>

  <div class="section">
    <div class="title">영업시간</div>
    <div>
      <div style="display:flex;gap:10px;padding:6px 0">
        <div style="width:120px">평일</div><div>08:00 - 21:00</div>
      </div>
      <div style="display:flex;gap:10px;padding:6px 0">
        <div style="width:120px">토요일</div><div>10:00 - 21:00</div>
      </div>
      <div style="display:flex;gap:10px;padding:6px 0">
        <div style="width:120px">일요일</div><div>휴무</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="title">함께 보기</div>
    <div class="cards">
      <div class="card" onclick="location.href='menu.html'">
        <img class="thumb" src="images/menu1.jpg" alt="menu1.jpg">
        <div class="body">
          <div class="name">오늘의 메뉴 보기</div>
          <p class="price">커피와 디저트</p>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="title">문의</div>
    <p class="sub">전화로 문의해 주세요. 예약 문의 폼은 아직 준비 중입니다.</p>
    <span class="mini" onclick="alert('070-0000-0000')">☎</span>
    <span class="mini" onclick="alert('인스타그램 준비 중')">◎</span>
    <span class="mini" onclick="alert('지도 앱 준비 중')">▶</span>
  </div>

  <div class="foot">초록상점 카페 · 서울 어딘가 · 070-0000-0000</div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>초록상점 카페</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="logo">초록상점 카페</div>
    <div class="nav">
      <a class="n-loca" href="location.html">오시는 길</a>
      <a class="n-menu" href="menu.html">메뉴</a>
      <a class="n-home" href="index.html">홈</a>
      <a href="notice/list.html">공지</a>
    </div>
  </div>
</div>

<div class="wrap">

  <img class="banner" src="images/event-autumn.png" alt="이미지">

  <div class="hero">
    <div class="big">메뉴</div>
    <p class="sub">계절에 따라 조금씩 바뀝니다.</p>
    <div class="search">
      <input type="text" id="q" placeholder="메뉴 검색">
      <div class="go" onclick="alert('검색은 준비 중입니다')">검색</div>
    </div>
  </div>

  <div class="section">
    <div class="title">커피</div>
    <div class="cards">
      <div class="card" onclick="alert('준비 중입니다')">
        <img class="thumb" src="images/menu1.jpg" alt="menu1.jpg">
        <div class="body">
          <div class="name">핸드드립 커피</div>
          <p class="price">5,000원</p>
        </div>
      </div>
      <div class="card" onclick="alert('준비 중입니다')">
        <img class="thumb" src="images/menu4.jpg" alt="menu4.jpg">
        <div class="body">
          <div class="name">아메리카노</div>
          <p class="price">4,000원</p>
        </div>
      </div>
      <div class="card" onclick="alert('준비 중입니다')">
        <img class="thumb" src="images/menu5.jpg" alt="menu5.jpg">
        <div class="body">
          <div class="name">카페 라테</div>
          <p class="price">4,500원</p>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="title">음료와 디저트</div>
    <div class="cards">
      <div class="card" onclick="alert('준비 중입니다')">
        <img class="thumb" src="images/menu2.jpg" alt="menu2.jpg">
        <div class="body">
          <div class="name">계절 과일 에이드</div>
          <p class="price">6,500원</p>
        </div>
      </div>
      <div class="card" onclick="alert('준비 중입니다')">
        <img class="thumb" src="images/menu3.jpg" alt="menu3.jpg">
        <div class="body">
          <div class="name">치즈 케이크</div>
          <p class="price">6,000원</p>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="title">알레르기 표시</div>
    <p class="sub">우유가 들어간 메뉴는 초록색 점, 견과류가 들어간 메뉴는 주황색 점으로 표시했습니다.</p>
    <p class="sub">
      <span style="color:#7cb342">●</span> 카페 라테, 치즈 케이크 &nbsp;
      <span style="color:#f57c00">●</span> 치즈 케이크
    </p>
  </div>

  <div class="foot">초록상점 카페 · 서울 어딘가 · 070-0000-0000</div>
</div>
</body>
</html>
